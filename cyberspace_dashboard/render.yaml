services:
  - type: web
    name: cyberspace-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DB_PATH
        value: /data/users.db
    disk:
      name: cyberspace-data
      mountPath: /data
      sizeGB: 1
