<style>
/* Grid Layout Overrides */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
  margin-top: 30px;
}

/* Premium 3D Tilt Card */
.challenge-card {
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 24px;
  position: relative;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  min-height: 180px;
  
  /* 3D Transform Setup */
  transform-style: preserve-3d;
  transform: perspective(1000px);
  transition: transform 0.1s, border-color 0.3s, box-shadow 0.3s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  overflow: hidden;
}

.challenge-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--border-color), transparent);
  transition: 0.3s;
  z-index: 10;
}

.challenge-card:hover {
  border-color: rgba(0, 210, 255, 0.3);
  box-shadow: 0 20px 40px rgba(0, 210, 255, 0.15), 0 0 0 1px rgba(0,210,255,0.1) inset;
}
.challenge-card:hover::before {
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
}

/* The Tracking Glow */
.card-glow {
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(0, 210, 255, 0.15) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
  transform: translate(-50%, -50%);
  z-index: 0;
}
.challenge-card:hover .card-glow {
  opacity: 1;
}

/* Internal Card Content */
.card-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100%;
  transform: translateZ(30px); /* Pops out slightly during 3D tilt */
}

.card-cat {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 16px;
  line-height: 1.3;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: auto;
}
.card-points {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  background: rgba(255,255,255,0.05);
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}

/* States */
.challenge-card.fogged {
  opacity: 0.4;
  filter: blur(2px) grayscale(1);
  cursor: not-allowed;
  transform: none !important;
}
.challenge-card.solved {
  border-color: rgba(0, 255, 102, 0.4);
  background: rgba(0, 255, 102, 0.05);
}
.challenge-card.solved::before {
  background: linear-gradient(90deg, transparent, var(--success), transparent);
}
.challenge-card.solved .card-glow {
  background: radial-gradient(circle, rgba(0, 255, 102, 0.15) 0%, transparent 70%);
}
.challenge-card.solved .card-points {
  color: var(--success);
  border-color: rgba(0, 255, 102, 0.3);
  background: rgba(0, 255, 102, 0.1);
}
.challenge-card.solved::after {
  content: 'COMPROMISED';
  position: absolute;
  top: 15px;
  right: -35px;
  transform: rotate(45deg);
  background: var(--success);
  color: #000;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 4px 40px;
  letter-spacing: 2px;
  box-shadow: 0 0 15px rgba(0,255,102,0.5);
  z-index: 5;
}

@keyframes hardPulse {
  0% { box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-color: var(--border-color); }
  50% { box-shadow: 0 10px 30px rgba(255, 51, 102, 0.2), inset 0 0 10px rgba(255, 51, 102, 0.1); border-color: rgba(255, 51, 102, 0.6); }
  100% { box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-color: var(--border-color); }
}

.challenge-card.hard:not(.solved):not(.fogged) {
  animation: hardPulse 2s infinite ease-in-out;
}
.challenge-card.hard:not(.solved):not(.fogged):hover {
  animation: none;
  border-color: rgba(255, 51, 102, 0.8);
  box-shadow: 0 20px 40px rgba(255, 51, 102, 0.2), inset 0 0 0 1px rgba(255, 51, 102, 0.1);
}
.challenge-card.hard:not(.solved):not(.fogged):hover::before {
  background: linear-gradient(90deg, transparent, rgba(255, 51, 102, 1), transparent);
}
.challenge-card.hard:not(.solved):not(.fogged) .card-glow {
  background: radial-gradient(circle, rgba(255, 51, 102, 0.15) 0%, transparent 70%);
}

/* Health Bar Overrides */
.health-bar-container {
  width: 100%;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(0, 210, 255, 0.2);
  border-radius: 6px;
  height: 30px;
  position: relative;
  overflow: hidden;
  margin-bottom: 40px;
  display: flex;
  align-items: center;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 15px rgba(0, 210, 255, 0.05);
}
.health-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, rgba(0, 210, 255, 0.3) 0%, var(--primary) 100%);
  width: 100%;
  transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 20px var(--primary-glow);
  position: relative;
}
.health-bar-fill::after {
  content: ''; position: absolute; top: 0; right: 0; width: 2px; height: 100%;
  background: #fff; box-shadow: 0 0 8px #fff, 0 0 15px var(--primary);
}
.health-bar-text {
  position: absolute;
  width: 100%;
  text-align: center;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 4px;
  text-shadow: 1px 1px 2px rgba(0,0,0,1), -1px -1px 2px rgba(0,0,0,1);
  z-index: 2;
}

/* Fingerprint Architecture */
.fingerprint-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 10px;
  padding-bottom: 20px;
}
.fingerprint-username {
  position: relative;
  margin-bottom: 24px;
}
.fingerprint-username::after {
  content: '';
  position: absolute;
  bottom: -24px;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 24px;
  background: rgba(0, 210, 255, 0.5);
}
.fingerprint-badges {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  max-width: 100%;
}
</style>

<!-- Profile Modal (Fingerprint) -->
<div class="modal-backdrop hidden" id="profileModal">

    <button class="modal-close" onclick="document.getElementById('profileModal').classList.add('hidden')">×</button>
    <div class="eyebrow">Hacker Fingerprint</div>
    
    <div class="fingerprint-container">
      <div class="fingerprint-username">
        <div id="usernameCard" class="challenge-card" style="min-height: auto; padding: 12px 24px; display: inline-block; transform-style: preserve-3d; transform: perspective(1000px); border-radius: 12px; cursor: default;">
          <div class="card-glow" id="usernameGlow"></div>
          <h2 id="profileTeamName" style="margin: 0; font-size: 26px; position: relative; z-index: 2; background: linear-gradient(90deg, #ff00aa, #00d2ff, #00ff66); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px;">Loading...</h2>
        </div>
      </div>
      <div class="fingerprint-badges" id="treeBranches">
        <!-- Dynamically populated badges -->
      </div>

    <button id="agentEvalBtn" class="btn-primary" style="margin-top:40px; width:100%; max-width: 400px;">Initialize Agent Evaluation</button>
    <div id="agentEvalContainer" class="challenge-card hidden" style="margin-top:20px; text-align:left; font-family:var(--mono); font-size:13px; color:#00D2FF; min-height: 100px; padding: 15px; cursor: default;">
      <div class="card-glow" id="evalGlow"></div>

<!-- Challenge Modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let challenges = [];
let activeCategory = 'All';
let fingerprintChartObj = null;

async function loadHealth() {
  const res = await fetch('/api/challenges/health');
  if (res.ok) {
    const data = await res.json();
    document.getElementById('healthFill').style.width = data.health + '%';
    document.getElementById('healthText').textContent = data.health + '% GLOBAL NETWORK INTEGRITY';
    if (data.health < 30) {
      document.getElementById('healthFill').style.background = 'linear-gradient(90deg, rgba(255,51,102,0.3) 0%, var(--danger) 100%)';
      document.getElementById('healthFill').style.boxShadow = '0 0 20px rgba(255,51,102,0.4)';
    } else if (data.health < 70) {
      document.getElementById('healthFill').style.background = 'linear-gradient(90deg, rgba(255,170,0,0.3) 0%, #ff9900 100%)';
      document.getElementById('healthFill').style.boxShadow = '0 0 20px rgba(255,153,0,0.4)';
    }
  }
}

async function loadChallenges() {
  const res = await fetch('/api/challenges');
  const data = await res.json();
  
  if (res.status === 403 && data.upcoming) {
    // Show Upcoming Overlay
    document.querySelector('main').innerHTML = `
      <div id="upcomingOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 14, 20, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50;">
        <h1 style="font-size: 60px; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); letter-spacing: 10px;">EVENT SCHEDULED</h1>
        <p style="color: var(--text-muted); font-size: 20px; font-family: var(--mono); margin-top: 20px;">TARGET SERVERS WILL BECOME AVAILABLE SOON</p>
      </div>
    `;
    return;
  }
  
  if (!res.ok) return;

  challenges = data;
  renderCategories();
  renderGrid();
  loadHealth();
}

function renderCategories() {
  const cats = ['All', ...new Set(challenges.map(c => c.category || 'Uncategorized'))];
  const tabs = document.getElementById('categoryTabs');
  tabs.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat;
    if (cat === activeCategory) btn.classList.add('active');
    btn.onclick = () => { activeCategory = cat; renderCategories(); renderGrid(); };
    tabs.appendChild(btn);
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  
  const filtered = activeCategory === 'All' ? challenges : challenges.filter(c => (c.category || 'Uncategorized') === activeCategory);
  if (filtered.length === 0) {
    grid.innerHTML = '<p>No active targets detected in this sector.</p>';
    return;
  }

  // Sort by points ascending
  filtered.sort((a,b) => a.points - b.points);

  filtered.forEach(c => {
    let locked = false;
    if (c.requires) {
      const req = challenges.find(x => x.id === c.requires);
      if (req && !req.solved) locked = true;
    }

    let displayPoints = c.points;
    if (anomalyState && anomalyState.categoryId === c.category_id && anomalyState.endTime > Date.now()) {
      displayPoints = Math.floor(c.points * anomalyState.multiplier);
    }

    const diffBadge = locked ? 'locked' : (c.difficulty || 'medium');

    const card = document.createElement('div');
    card.id = 'node-' + c.id;
    card.className = 'challenge-card ' + (c.difficulty || 'medium') + (c.solved ? ' solved' : '') + (locked ? ' fogged' : '');
    
    card.innerHTML = `
      <div class="card-glow"></div>
      <div class="card-content">
        <div class="card-cat">${escapeHtml(c.category || 'Uncategorized')}</div>
        <div class="card-title">${escapeHtml(c.title)}</div>
        <div class="card-footer">
          <span class="badge-${diffBadge}" style="font-size:10px; padding:3px 8px; border-radius:4px; border:1px solid currentColor;">${diffBadge.toUpperCase()}</span>
          <span class="card-points">${displayPoints} pts</span>
        </div>
      </div>
    `;

    if (!locked) {
      card.onclick = () => openChallenge(c.id);
      
      // 3D Tilt & Glow Effect
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Move glow
        const glow = card.querySelector('.card-glow');
        glow.style.left = x + 'px';
        glow.style.top = y + 'px';
        
        // Calculate tilt
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -8; // max 8 deg tilt
        const rotateY = ((x - centerX) / centerX) * 8;
        
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
      });
      
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
      });
    }

    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function openChallenge(id) {
  const c = challenges.find(x => x.id === id);
  if (!c) return;
  
  const hintsHtml = (c.hints || []).map(h => `
    <div class="hint-box">
      <div>Hint (-${h.cost} pts)${h.revealed ? '' : ` — <a href="#" class="reveal-link" data-hint-id="${h.id}">decrypt</a>`}</div>
      ${h.revealed ? `<div class="hint-text">${escapeHtml(h.text)}</div>` : ''}
    </div>
  `).join('');

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" id="closeModal">×</button>
    <div class="eyebrow">${escapeHtml(c.category || 'Uncategorized')}</div>
    <h2 style="margin-top:6px;">${escapeHtml(c.title)}</h2>
    <div class="markdown-body" style="margin-bottom: 20px;">${marked.parse(c.description || '')}</div>
    ${c.link ? `<p><a href="${escapeHtml(c.link)}" target="_blank" rel="noopener">Access Target →</a></p>` : ''}
    ${c.docker_image && !c.solved ? `
      <div id="sandbox-area" style="background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h4 style="margin:0 0 10px 0; color:var(--primary); font-family:var(--mono);">[DOCKER SANDBOX]</h4>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:15px;">This challenge requires an isolated environment. Deploy a personal container instance to proceed.</p>
        <button id="deployBtn" class="btn-primary" style="width:100%; background:transparent; border:1px solid var(--primary); color:var(--primary);">Deploy Instance</button>
        <div id="deployStatus" class="hidden" style="margin-top:15px; font-family:var(--mono); font-size:12px;">
           <div>Provisioning Container...</div>
           <div style="width:100%; background:#222; height:4px; margin-top:5px; border-radius:2px; overflow:hidden;">
             <div id="deployProgress" style="width:0%; background:var(--primary); height:100%; transition: width 0.1s linear;"></div>
           </div>
        </div>
        <div id="deployResult" class="hidden" style="margin-top:15px; font-family:var(--mono); color:var(--success); background:rgba(0,255,102,0.1); border:1px dashed var(--success); padding:10px;"></div>
      </div>
    ` : ''}
    ${hintsHtml}
    <div id="submitArea" style="margin-top:24px;">
      ${c.solved
        ? `<div class="alert alert-success" style="justify-content:center; font-family:var(--mono);">✓ TARGET COMPROMISED</div>`
        : `
          <label for="flagInput">Inject Flag</label>
          <input id="flagInput" placeholder="flag{...}" style="font-family:var(--mono);">
          <button id="submitFlagBtn" class="btn-primary" style="width:100%;">Execute</button>
          <div id="submitMsg" style="margin-top:10px;"></div>
        `
      }
    </div>
  `;

  document.getElementById('modalBackdrop').classList.remove('hidden');
  document.getElementById('closeModal').onclick = closeModal;

  document.querySelectorAll('.reveal-link').forEach(link => {
    link.onclick = async (e) => {
      e.preventDefault();
      const hintId = link.dataset.hintId;
      await fetch(`/api/challenges/hints/${hintId}/reveal`, { method: 'POST' });
      await loadChallenges();
      openChallenge(id);
    };
  });

  const deployBtn = document.getElementById('deployBtn');
  if (deployBtn) {
    deployBtn.onclick = async () => {
      deployBtn.disabled = true;
      document.getElementById('deployStatus').classList.remove('hidden');
      const resEl = document.getElementById('deployResult');
      resEl.classList.add('hidden');
      const prog = document.getElementById('deployProgress');
      prog.style.width = '100%';
      prog.style.transition = 'width 2s ease';

      try {
        const res = await fetch(`/api/challenges/${id}/deploy`, { method: 'POST' });
        const data = await res.json();
        
        document.getElementById('deployStatus').classList.add('hidden');
        resEl.classList.remove('hidden');
        
        if (res.ok) {
          resEl.style.color = 'var(--success)';
          resEl.style.borderColor = 'var(--success)';
          resEl.style.background = 'rgba(0,255,102,0.1)';
          resEl.innerHTML = `Instance Deployed.<br/><br/>Target IP: <b>${data.ip}:${data.port}</b><br/>Destroys in: 30:00`;
        } else {
          resEl.style.color = 'var(--danger)';
          resEl.style.borderColor = 'var(--danger)';
          resEl.style.background = 'rgba(255,51,102,0.1)';
          resEl.innerHTML = `Deployment Failed:<br/><br/><b>${data.error || 'Unknown error.'}</b>`;
          deployBtn.disabled = false;
        }
      } catch (err) {
        document.getElementById('deployStatus').classList.add('hidden');
        resEl.classList.remove('hidden');
        resEl.style.color = 'var(--danger)';
        resEl.style.borderColor = 'var(--danger)';
        resEl.style.background = 'rgba(255,51,102,0.1)';
        resEl.innerHTML = `Network error contacting server.`;
        deployBtn.disabled = false;
      }
    };
  }

  const submitBtn = document.getElementById('submitFlagBtn');
  if (submitBtn) {
    submitBtn.onclick = async () => {
      const flagInput = document.getElementById('flagInput');
      const flag = flagInput.value.trim();
      const msg = document.getElementById('submitMsg');

      if (!/^(flag|FLAG)\{.*\}$/.test(flag)) {
        flagInput.style.borderColor = 'red';
        flagInput.style.boxShadow = '0 0 10px red';
        flagInput.style.animation = 'shake 0.3s';
        setTimeout(() => { flagInput.style.animation = ''; }, 300);
        msg.innerHTML = `<div style="color:var(--danger); font-family:var(--mono);">Invalid format: Flags must match flag{...}</div>`;
        return;
      }
      flagInput.style.borderColor = '';
      flagInput.style.boxShadow = '';

      submitBtn.disabled = true;
      const res = await fetch(`/api/challenges/${id}/submit`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ flag })
      });
      const data = await res.json();
      if (res.ok && data.correct) {
        msg.innerHTML = `<div style="color:var(--success); font-family:var(--mono);">Access Granted. +${data.points} pts</div>`;
        await loadChallenges();
        setTimeout(closeModal, 1000);
      } else {
        msg.innerHTML = `<div style="color:var(--danger); font-family:var(--mono); animation: shake 0.3s;">Access Denied.</div>`;
        submitBtn.disabled = false;
      }
    };
  }
}

function closeModal() { document.getElementById('modalBackdrop').classList.add('hidden'); }
document.getElementById('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeModal(); });

// Profile Modal / Fingerprint Chart
document.getElementById('profileBtn').onclick = async () => {
  document.getElementById('profileModal').classList.remove('hidden');
  const res = await fetch('/api/auth/profile');
  const data = await res.json();
  
  const labels = data.map(d => d.category);
  
  // Generate Tree Branches
  const treeBranches = document.getElementById('treeBranches');
  treeBranches.innerHTML = '';
  
  labels.forEach(label => {
    if(label === 'Unknown' || label === 'null' || !label) return;
    
    const badge = document.createElement('div');
    badge.className = 'challenge-card';
    badge.style.minHeight = 'auto';
    badge.style.padding = '8px 16px';
    badge.style.borderRadius = '8px';
    badge.style.cursor = 'default';
    badge.style.display = 'inline-block';
    
    badge.innerHTML = `
      <div class="card-glow" style="background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, transparent 70%);"></div>
      <span style="position: relative; z-index: 2; font-family: var(--mono); font-weight: bold; background: linear-gradient(90deg, #00d2ff, #00ff66); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${label}</span>
    `;
    
    badge.addEventListener('mousemove', (e) => {
      const rect = badge.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const glow = badge.querySelector('.card-glow');
      if(glow) {
        glow.style.left = x + 'px';
        glow.style.top = y + 'px';
      }
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -20;
      const rotateY = ((x - centerX) / centerX) * 20;
      badge.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.1)`;
      badge.style.borderColor = 'rgba(0, 210, 255, 0.6)';
    });
    
    badge.addEventListener('mouseleave', () => {
      badge.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
      badge.style.borderColor = 'var(--border-color)';
    });
    
    treeBranches.appendChild(badge);
  });
  
  // Reset agent eval
  document.getElementById('agentEvalContainer').classList.add('hidden');
  const evalBtn = document.getElementById('agentEvalBtn');
  evalBtn.disabled = false;
  evalBtn.textContent = 'Initialize Agent Evaluation';
};

document.getElementById('agentEvalBtn').onclick = async () => {
  const container = document.getElementById('agentEvalContainer');
  const textDiv = document.getElementById('agentEvalText');
  const btn = document.getElementById('agentEvalBtn');
  
  container.classList.remove('hidden');
  btn.disabled = true;
  btn.textContent = 'Agent is analyzing...';
  textDiv.innerHTML = 'Connecting to Neural Network...<br/>Analyzing platform telemetry...<br/>';
  
  try {
    const res = await fetch('/api/auth/analysis');
    const data = await res.json();
    
    let report = '<br/><b>[ ANALYSIS COMPLETE ]</b><br/><br/>';
    
    report += '<b><span style="color:#00D2FF;">> STRONG DOMAINS</span></b><br/>';
    if (data.strong.length > 0) {
      report += `Your top performing categories are: ${data.strong.slice(0,3).join(', ')}. Keep exploiting these strengths.<br/>`;
    } else {
      report += `Insufficient solve data to determine strong domains.<br/>`;
    }
    
    report += '<br/><b><span style="color:var(--danger);">> KNOWLEDGE GAPS / SKIPS</span></b><br/>';
    if (data.gaps.length > 0) {
      report += `You have completely avoided these categories: ${data.gaps.join(', ')}. This indicates a lack of knowledge or confidence in these specific areas.<br/>`;
    } else {
      report += `No significant knowledge gaps detected. You are engaging with all sectors.<br/>`;
    }
    
    report += '<br/><b><span style="color:var(--amber);">> NEAR-COMPLETION (STUCK)</span></b><br/>';
    if (data.stuck.length > 0) {
      report += `I noticed significant effort (multiple failed payloads) on: ${data.stuck.join(', ')}. You have the concepts down, you are just missing the final piece to break it. Don't give up.<br/>`;
    } else {
      report += `No stuck targets detected. You either solve quickly or haven't pushed hard enough on difficult targets.<br/>`;
    }
    
    // Typewriter effect
    textDiv.innerHTML = '';
    let i = 0;
    const speed = 10;
    
    function typeWriter() {
      if (i < report.length) {
        if (report.substring(i, i+5) === '<br/>') {
          textDiv.innerHTML += '<br/>';
          i += 5;
        } else if (report.substring(i, i+3) === '<b>' || report.substring(i, i+4) === '</b>') {
           const end = report.indexOf('>', i);
           textDiv.innerHTML += report.substring(i, end+1);
           i = end+1;
        } else if (report.substring(i, i+5) === '<span') {
           const end = report.indexOf('>', i);
           textDiv.innerHTML += report.substring(i, end+1);
           i = end+1;
        } else if (report.substring(i, i+7) === '</span>') {
           textDiv.innerHTML += '</span>';
           i += 7;
        } else {
          textDiv.innerHTML += report.charAt(i);
          i++;
        }
        setTimeout(typeWriter, speed);
      } else {
        btn.textContent = 'Analysis Complete';
      }
    }
    typeWriter();
    
  } catch (e) {
    textDiv.innerHTML += '<br/><span style="color:red;">Error connecting to Analyst Bot.</span>';
    btn.disabled = false;
    btn.textContent = 'Initialize Agent Evaluation';
  }
};

const socket = io();
socket.on('activity', () => { loadChallenges(); });

let anomalyState = null;
let anomalyInterval = null;

socket.on('anomaly:start', (anomaly) => { anomalyState = anomaly; renderAnomaly(); renderGrid(); });
socket.on('anomaly:end', () => { anomalyState = null; renderAnomaly(); renderGrid(); });
fetch('/api/challenges/anomaly/current').then(r=>r.json()).then(data => {
  if (data.categoryId) { anomalyState = data; renderAnomaly(); renderGrid(); }
});

function renderAnomaly() {
  const banner = document.getElementById('anomalyBanner');
  clearInterval(anomalyInterval);
  if (!anomalyState) { banner.classList.add('hidden'); return; }
  
  banner.classList.remove('hidden');
  document.getElementById('anomalyDesc').textContent = `${anomalyState.multiplier}x points for [${anomalyState.categoryName}]`;
  
  const updateTimer = () => {
    const remaining = anomalyState.endTime - Date.now();
    if (remaining <= 0) {
      banner.classList.add('hidden');
      clearInterval(anomalyInterval);
      anomalyState = null;
      renderGrid();
    } else {
      const m = Math.floor(remaining / 60000);
      const s = Math.floor((remaining % 60000) / 1000).toString().padStart(2, '0');
      document.getElementById('anomalyTimer').textContent = `${m}:${s}`;
    }
  };
  updateTimer();
  anomalyInterval = setInterval(updateTimer, 1000);
}
