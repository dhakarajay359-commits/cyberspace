<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTF Platform — Access</title>
<link rel="stylesheet" href="/css/style.css?v=4">
<script src="/socket.io/socket.io.js"></script>
<script src="/js/firstblood.js"></script>
<script src="/js/notifications.js"></script>`n<script src="/js/timer.js"></script>`n<script src="/js/chat.js"></script>`n<script src="/js/anticheat.js"></script>`n<link rel="stylesheet" href="/css/terminal.css">`n<script src="/js/terminal.js"></script>`n</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="boot-line" id="bootLine">&gt; initializing session...</div>
    <h1 style="margin-bottom: 4px;" id="eventName">CTF</h1>
    <p style="margin-bottom: 24px;">Register a team or sign in to view challenges.</p>

    <div class="tabs">
      <button id="tabLogin" class="active">Sign in</button>
      <button id="tabRegister">Register team</button>
    </div>

    <div id="alertBox" class="alert alert-error hidden"></div>

    <form id="loginForm">
      <label for="loginName">Team name</label>
      <input id="loginName" name="teamName" required placeholder="e.g. nullpointers">
      <label for="loginPass">Password</label>
      <input id="loginPass" name="password" type="password" required placeholder="••••••••">
      <button type="submit" style="width:100%;">Sign in →</button>
    </form>

    <form id="registerForm" class="hidden">
      <label for="regName">Team name</label>
      <input id="regName" name="teamName" required placeholder="3+ characters" minlength="3">
      <label for="regPass">Password</label>
      <input id="regPass" name="password" type="password" required placeholder="6+ characters" minlength="6">
      <button type="submit" style="width:100%;">Create team →</button>
    </form>

    <p style="margin-top: 20px; font-size: 12px;">
      <a href="/scoreboard.html">View scoreboard</a>
    </p>
  </div>
</div>

<script>
const alertBox = document.getElementById('alertBox');
function showError(msg) {
  alertBox.textContent = msg;
  alertBox.classList.remove('hidden');
}
function clearError() { alertBox.classList.add('hidden'); }

const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

tabLogin.onclick = () => {
  tabLogin.classList.add('active'); tabRegister.classList.remove('active');
  loginForm.classList.remove('hidden'); registerForm.classList.add('hidden');
  clearError();
};
tabRegister.onclick = () => {
  tabRegister.classList.add('active'); tabLogin.classList.remove('active');
  registerForm.classList.remove('hidden'); loginForm.classList.add('hidden');
  clearError();
};

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const teamName = document.getElementById('loginName').value;
  const password = document.getElementById('loginPass').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ teamName, password })
  });
  const data = await res.json();
  if (!res.ok) return showError(data.error || 'Login failed.');
  window.location.href = '/challenges.html';
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const teamName = document.getElementById('regName').value;
  const password = document.getElementById('regPass').value;
  const res = await fetch('/api/auth/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ teamName, password })
  });
  const data = await res.json();
  if (!res.ok) return showError(data.error || 'Registration failed.');
  window.location.href = '/challenges.html';
});

// Boot sequence flavor text + event name
const bootLine = document.getElementById('bootLine');
const lines = ['> initializing session...', '> handshake ok', '> awaiting credentials_'];
let i = 0;
setInterval(() => { i = (i + 1) % lines.length; bootLine.textContent = lines[i]; }, 1800);

// Redirect if already logged in
fetch('/api/auth/me').then(r => r.json()).then(d => {
  if (d.team) window.location.href = '/challenges.html';
});

fetch('/api/auth/public-settings').then(r => r.json()).then(d => {
  document.getElementById('eventName').textContent = d.event_name;
  document.title = d.event_name + ' — Access';
});
</script>
</body>
</html>
