{% extends "base.html" %}
{% set active_page = "ctf_platform" %}

{% block title %}CTF Platform - Cyberspace Dashboard{% endblock %}

{% block extra_head %}
<style>
    /* Remove padding from main content to make iframe full size */
    .main-content {
        padding: 0 !important;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }
    
    .ctf-container {
        flex: 1;
        width: 100%;
        height: 100%;
        background: var(--bg-base);
    }
    
    .ctf-iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="ctf-container">
    <iframe src="{{ ctf_url }}" class="ctf-iframe" allow="clipboard-read; clipboard-write"></iframe>
</div>
{% endblock %}
