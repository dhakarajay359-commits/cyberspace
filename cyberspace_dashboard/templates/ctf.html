{% extends "base.html" %}
{% set active_page = "ctf" %}

{% block title %}CTF Challenges — Cyberspace{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* ── CTF Layout ─────────────────────────────── */
  .ctf-wrap { max-width: 1280px; margin: 0 auto; }

  .ctf-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px;
  }
  .ctf-header h1 {
    font-family: var(--font-sans); font-size: 2rem; font-weight: 700;
    background: linear-gradient(135deg, #00d2ff, #ff0066);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .ctf-nav-btn {
    padding: 8px 18px; border-radius: 8px; border: 1px solid #272a33;
    background: #16191f; color: #94a3b8; cursor: pointer; font-size: 0.9rem;
    text-decoration: none; transition: all 0.2s;
  }
  .ctf-nav-btn:hover, .ctf-nav-btn.active {
    border-color: #00d2ff; color: #fff; background: rgba(0,210,255,0.08);
  }

  /* ── Health Bar ─────────────────────────────── */
  .health-wrap { margin-bottom: 28px; }
  .health-bar-outer {
    height: 28px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,210,255,0.2);
    border-radius: 6px; position: relative; overflow: hidden;
  }
  .health-bar-inner {
    height: 100%; background: linear-gradient(90deg, rgba(0,210,255,0.3), #00d2ff);
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 0 20px rgba(0,210,255,0.4);
  }
  .health-bar-label {
    position: absolute; width: 100%; top: 0; left: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 3px; color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  /* ── Category Tabs ──────────────────────────── */
  .cat-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .cat-tab {
    padding: 6px 16px; border-radius: 20px; border: 1px solid #272a33;
    background: #16191f; color: #94a3b8; cursor: pointer; font-size: 0.85rem;
    transition: all 0.2s;
  }
  .cat-tab.active, .cat-tab:hover {
    border-color: #00d2ff; color: #00d2ff; background: rgba(0,210,255,0.08);
  }

  /* ── Challenge Grid ─────────────────────────── */
  .ctf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  .ctf-card {
    background: #16191f; border: 1px solid #272a33; border-radius: 14px;
    padding: 22px; cursor: pointer; position: relative; overflow: hidden;
    transition: transform 0.15s, border-color 0.25s, box-shadow 0.25s;
    display: flex; flex-direction: column; min-height: 170px;
  }
  .ctf-card:hover {
    transform: translateY(-3px);
    border-color: rgba(0,210,255,0.4);
    box-shadow: 0 16px 40px rgba(0,210,255,0.12);
  }
  .ctf-card.solved {
    border-color: rgba(16,185,129,0.45);
    background: rgba(16,185,129,0.05);
  }
  .ctf-card.solved::after {
    content: 'SOLVED ✓';
    position: absolute; top: 10px; right: -28px;
    transform: rotate(45deg);
    background: #10b981; color: #000;
    font-size: 10px; font-weight: 700;
    padding: 3px 38px; letter-spacing: 1px;
  }
  .ctf-card.locked { opacity: 0.4; filter: blur(1px) grayscale(1); cursor: not-allowed; }
  .ctf-card.hard:not(.solved):not(.locked) { animation: redPulse 2.5s infinite ease-in-out; }

  @keyframes redPulse {
    0%,100% { box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-color: #272a33; }
    50% { box-shadow: 0 8px 24px rgba(255,51,102,0.2); border-color: rgba(255,51,102,0.5); }
  }

  .ctf-card-cat {
    font-size: 11px; color: #00d2ff; letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 600; margin-bottom: 10px;
  }
  .ctf-card-title {
    font-size: 1.05rem; font-weight: 600; color: #f8fafc;
    margin-bottom: auto; line-height: 1.4;
  }
  .ctf-card-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px;
  }
  .ctf-diff {
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
    border: 1px solid currentColor; text-transform: uppercase;
  }
  .ctf-diff.easy { color: #10b981; }
  .ctf-diff.medium { color: #f59e0b; }
  .ctf-diff.hard { color: #ef4444; }
  .ctf-diff.insane { color: #a855f7; }
  .ctf-diff.locked { color: #64748b; }
  .ctf-pts {
    font-family: monospace; font-size: 14px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* ── Modal ──────────────────────────────────── */
  .ctf-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .ctf-backdrop.open { opacity: 1; pointer-events: auto; }
  .ctf-modal {
    background: #16191f; border: 1px solid #272a33; border-radius: 16px;
    width: 100%; max-width: 620px; max-height: 88vh;
    overflow-y: auto; padding: 32px; position: relative;
    transform: scale(0.95); transition: transform 0.25s;
  }
  .ctf-backdrop.open .ctf-modal { transform: scale(1); }
  .ctf-modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; color: #94a3b8;
    font-size: 24px; cursor: pointer; line-height: 1;
  }
  .ctf-modal-close:hover { color: #fff; }
  .ctf-modal-eyebrow {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #00d2ff; font-weight: 600; margin-bottom: 8px;
  }
  .ctf-modal-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; color: #f8fafc; }
  .ctf-modal-desc { color: #94a3b8; line-height: 1.7; margin-bottom: 20px; font-size: 0.95rem; }
  .ctf-modal-desc code { background: rgba(255,255,255,0.07); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
  .ctf-hint-box {
    background: rgba(255,255,255,0.04); border: 1px solid #272a33;
    border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; font-size: 0.88rem;
  }
  .ctf-hint-reveal { color: #00d2ff; cursor: pointer; text-decoration: underline; }
  .ctf-flag-input {
    width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3);
    border: 1px solid #272a33; border-radius: 8px; color: #f8fafc;
    font-family: monospace; font-size: 1rem; margin-bottom: 10px; box-sizing: border-box;
    transition: border-color 0.2s;
  }
  .ctf-flag-input:focus { outline: none; border-color: #00d2ff; }
  .ctf-submit-btn {
    width: 100%; padding: 12px; background: linear-gradient(135deg, #00d2ff, #0066ff);
    border: none; border-radius: 8px; color: #fff; font-size: 1rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  .ctf-submit-btn:hover { opacity: 0.85; }
  .ctf-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ctf-msg { margin-top: 10px; font-family: monospace; font-size: 0.9rem; }
  .ctf-msg.ok { color: #10b981; }
  .ctf-msg.err { color: #ef4444; }
  .ctf-already { background: rgba(16,185,129,0.1); border: 1px dashed #10b981;
    border-radius: 8px; padding: 12px; text-align: center;
    color: #10b981; font-family: monospace; font-weight: 600; }

  .ctf-empty { color: #94a3b8; text-align: center; padding: 60px 20px; font-size: 1rem; }

  @keyframes shake {
    10%,90% { transform: translateX(-2px); }
    20%,80% { transform: translateX(4px); }
    30%,50%,70% { transform: translateX(-6px); }
    40%,60% { transform: translateX(6px); }
  }
</style>
{% endblock %}

{% block content %}
<div class="ctf-wrap">
  <!-- Header -->
  <div class="ctf-header">
    <h1>🚩 CTF Challenges</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <a href="/ctf/scoreboard" class="ctf-nav-btn">Scoreboard</a>
      <span id="ctfUserBadge" style="font-size:0.85rem;color:#94a3b8;"></span>
    </div>
  </div>

  <!-- Health Bar -->
  <div class="health-wrap">
    <div class="health-bar-outer">
      <div class="health-bar-inner" id="healthBar" style="width:100%;"></div>
      <div class="health-bar-label" id="healthLabel">LOADING NETWORK INTEGRITY...</div>
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="cat-tabs" id="catTabs"></div>

  <!-- Grid -->
  <div class="ctf-grid" id="ctfGrid">
    <div class="ctf-empty">Loading challenges...</div>
  </div>
</div>

<!-- Challenge Modal -->
<div class="ctf-backdrop" id="ctfBackdrop">
  <div class="ctf-modal" id="ctfModal">
    <button class="ctf-modal-close" id="ctfClose">×</button>
    <div id="ctfModalBody"></div>
  </div>
</div>

<script>
let allChallenges = [];
let activeCategory = 'All';

// ── Load challenges ──────────────────────────────────────────────────────
async function loadChallenges() {
  const res = await fetch('/api/ctf/challenges');
  if (!res.ok) { document.getElementById('ctfGrid').innerHTML = '<div class="ctf-empty">Error loading challenges.</div>'; return; }
  allChallenges = await res.json();
  updateHealth();
  renderCatTabs();
  renderGrid();
}

function updateHealth() {
  const total = allChallenges.length;
  const solved = allChallenges.filter(c => c.solved).length;
  const pct = total ? Math.max(0, 100 - (solved / total * 100)) : 100;
  document.getElementById('healthBar').style.width = pct.toFixed(1) + '%';
  document.getElementById('healthLabel').textContent = pct.toFixed(1) + '% GLOBAL NETWORK INTEGRITY';
  const bar = document.getElementById('healthBar');
  if (pct < 30) { bar.style.background = 'linear-gradient(90deg,rgba(255,51,102,0.3),#ef4444)'; bar.style.boxShadow = '0 0 20px rgba(255,51,102,0.4)'; }
  else if (pct < 70) { bar.style.background = 'linear-gradient(90deg,rgba(255,153,0,0.3),#f59e0b)'; bar.style.boxShadow = '0 0 20px rgba(245,158,11,0.4)'; }
}

function renderCatTabs() {
  const cats = ['All', ...new Set(allChallenges.map(c => c.category || 'Misc'))];
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (cat === activeCategory ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeCategory = cat; renderCatTabs(); renderGrid(); };
    tabs.appendChild(btn);
  });
}

function renderGrid() {
  const grid = document.getElementById('ctfGrid');
  const filtered = activeCategory === 'All' ? allChallenges : allChallenges.filter(c => (c.category || 'Misc') === activeCategory);
  if (!filtered.length) { grid.innerHTML = '<div class="ctf-empty">No challenges in this category.</div>'; return; }
  filtered.sort((a,b) => a.points - b.points);
  grid.innerHTML = '';
  filtered.forEach(c => {
    const locked = c.requires && !allChallenges.find(x => x.id === c.requires)?.solved;
    const diff = locked ? 'locked' : (c.difficulty || 'medium');
    const card = document.createElement('div');
    card.className = `ctf-card ${c.difficulty || 'medium'}${c.solved ? ' solved' : ''}${locked ? ' locked' : ''}`;
    card.innerHTML = `
      <div class="ctf-card-cat">${esc(c.category || 'Misc')}</div>
      <div class="ctf-card-title">${esc(c.title)}</div>
      <div class="ctf-card-footer">
        <span class="ctf-diff ${diff}">${diff.toUpperCase()}</span>
        <span class="ctf-pts">${c.points} pts</span>
      </div>`;
    if (!locked) card.onclick = () => openModal(c.id);
    grid.appendChild(card);
  });
}

// ── Modal ────────────────────────────────────────────────────────────────
function openModal(id) {
  const c = allChallenges.find(x => x.id === id);
  if (!c) return;
  const hintsHtml = (c.hints || []).map(h => `
    <div class="ctf-hint-box">
      <strong>Hint</strong> (-${h.cost} pts)
      ${h.revealed ? `<div style="color:#94a3b8;margin-top:6px;">${esc(h.text)}</div>` : `— <span class="ctf-hint-reveal" data-hint="${h.id}">reveal</span>`}
    </div>`).join('');

  const submitArea = c.solved
    ? `<div class="ctf-already">✓ CHALLENGE SOLVED</div>`
    : `<input class="ctf-flag-input" id="flagIn" placeholder="flag{...}">
       <button class="ctf-submit-btn" id="submitBtn">Submit Flag</button>
       <div class="ctf-msg" id="flagMsg"></div>`;

  document.getElementById('ctfModalBody').innerHTML = `
    <div class="ctf-modal-eyebrow">${esc(c.category || 'Misc')}</div>
    <div class="ctf-modal-title">${esc(c.title)}</div>
    <div class="ctf-modal-desc markdown-body">${marked.parse(c.description || '')}</div>
    ${c.link ? `<p style="margin-bottom:16px;"><a href="${esc(c.link)}" target="_blank" style="color:#00d2ff;">Access Target →</a></p>` : ''}
    ${hintsHtml}
    <div style="margin-top:24px;">${submitArea}</div>`;

  document.getElementById('ctfBackdrop').classList.add('open');

  // Hint reveals
  document.querySelectorAll('.ctf-hint-reveal').forEach(el => {
    el.onclick = async () => {
      const hintId = el.dataset.hint;
      const r = await fetch(`/api/ctf/hints/${hintId}/reveal`, { method: 'POST' });
      if (r.ok) { await loadChallenges(); openModal(id); }
    };
  });

  // Flag submit
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) {
    submitBtn.onclick = async () => {
      const flag = document.getElementById('flagIn').value.trim();
      const msg = document.getElementById('flagMsg');
      if (!/^(flag|FLAG)\{.*\}$/.test(flag)) {
        document.getElementById('flagIn').style.animation = 'shake 0.4s';
        setTimeout(() => document.getElementById('flagIn').style.animation = '', 400);
        msg.innerHTML = '<span class="err">Invalid format — must be flag{...}</span>';
        return;
      }
      submitBtn.disabled = true;
      const r = await fetch(`/api/ctf/challenges/${id}/submit`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ flag })
      });
      const data = await r.json();
      if (r.ok && data.correct) {
        msg.innerHTML = `<span class="ok">✓ Access Granted! +${data.points} pts</span>`;
        await loadChallenges();
        setTimeout(() => closeModal(), 1000);
      } else {
        msg.innerHTML = `<span class="err">${data.error || 'Access Denied.'}</span>`;
        submitBtn.disabled = false;
      }
    };
    document.getElementById('flagIn').addEventListener('keypress', e => { if (e.key === 'Enter') submitBtn.click(); });
  }
}

function closeModal() {
  document.getElementById('ctfBackdrop').classList.remove('open');
}
document.getElementById('ctfClose').onclick = closeModal;
document.getElementById('ctfBackdrop').addEventListener('click', e => { if (e.target.id === 'ctfBackdrop') closeModal(); });

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

// ── Init ─────────────────────────────────────────────────────────────────
loadChallenges();
</script>
{% endblock %}
