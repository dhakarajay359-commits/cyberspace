{% extends "base.html" %}
{% set active_page = "ctf" %}

{% block title %}CTF Scoreboard — Cyberspace{% endblock %}

{% block extra_head %}
<style>
  .ctf-sb-wrap { max-width: 860px; margin: 0 auto; }
  .ctf-sb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  .ctf-sb-header h1 {
    font-family: var(--font-sans); font-size: 2rem; font-weight: 700;
    background: linear-gradient(135deg, #00d2ff, #ff0066);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .ctf-back {
    padding: 8px 18px; border-radius: 8px; border: 1px solid #272a33;
    background: #16191f; color: #94a3b8; cursor: pointer; font-size: 0.9rem;
    text-decoration: none; transition: all 0.2s;
  }
  .ctf-back:hover { border-color: #00d2ff; color: #fff; }

  .sb-table { width: 100%; border-collapse: collapse; }
  .sb-table th {
    text-align: left; padding: 10px 16px; font-size: 0.78rem;
    color: #64748b; text-transform: uppercase; letter-spacing: 1px;
    border-bottom: 1px solid #272a33;
  }
  .sb-table td { padding: 14px 16px; border-bottom: 1px solid rgba(39,42,51,0.6); }
  .sb-table tr:hover td { background: rgba(255,255,255,0.02); }
  .sb-rank { font-family: monospace; font-weight: 700; color: #64748b; font-size: 1rem; }
  .sb-rank.gold { color: #fbbf24; font-size: 1.2rem; }
  .sb-rank.silver { color: #94a3b8; font-size: 1.1rem; }
  .sb-rank.bronze { color: #cd7c2e; font-size: 1.05rem; }
  .sb-user { font-weight: 600; color: #f8fafc; }
  .sb-score { font-family: monospace; font-weight: 700; color: #00d2ff; }
  .sb-solves { color: #94a3b8; font-size: 0.9rem; }
  .sb-bar-wrap { display: flex; align-items: center; gap: 10px; }
  .sb-bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #00d2ff, #ff0066); min-width: 4px; }
  .sb-empty { text-align: center; color: #64748b; padding: 60px; }
</style>
{% endblock %}

{% block content %}
<div class="ctf-sb-wrap">
  <div class="ctf-sb-header">
    <h1>🏆 Scoreboard</h1>
    <a href="/ctf" class="ctf-back">← Challenges</a>
  </div>

  <div id="sbContainer"><p class="sb-empty">Loading scoreboard...</p></div>
</div>

<script>
async function loadScoreboard() {
  const res = await fetch('/api/ctf/scoreboard');
  const board = await res.json();
  const el = document.getElementById('sbContainer');

  if (!board.length) {
    el.innerHTML = '<p class="sb-empty">No solves yet — be the first to score!</p>';
    return;
  }

  const maxScore = board[0].score || 1;
  const rankIcon = ['🥇','🥈','🥉'];
  const rankClass = ['gold','silver','bronze'];

  el.innerHTML = `
    <table class="sb-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th>Score</th>
          <th>Solves</th>
          <th style="width:200px;">Progress</th>
        </tr>
      </thead>
      <tbody>
        ${board.map((row, i) => `
          <tr>
            <td><span class="sb-rank ${rankClass[i] || ''}">${rankIcon[i] || i+1}</span></td>
            <td><span class="sb-user">${esc(row.username)}</span></td>
            <td><span class="sb-score">${row.score} pts</span></td>
            <td><span class="sb-solves">${row.solves} challenge${row.solves !== 1 ? 's' : ''}</span></td>
            <td>
              <div class="sb-bar-wrap">
                <div class="sb-bar" style="width:${Math.round(row.score/maxScore*180)}px;"></div>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

loadScoreboard();
</script>
{% endblock %}
