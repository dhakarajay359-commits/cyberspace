{% extends "base.html" %}

{% block title %}Account Settings - Cyberspace{% endblock %}

{% block content %}
<div class="px-8 py-6 w-full h-full overflow-y-auto bg-[#0a0a0c]">
    
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white mb-2" style="font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.5px;">Settings</h1>
        <p class="text-gray-400 text-sm">Manage your account preferences, security, and interface settings.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-6xl">
        
        <!-- Left Sidebar Navigation for Settings -->
        <div class="lg:col-span-1 flex flex-col space-y-2">
            <button class="flex items-center justify-between px-4 py-3 bg-[#16161a] border border-[#2d2d35] rounded-lg text-white hover:bg-[#1f1f24] transition-all">
                <div class="flex items-center space-x-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-cyan-400"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span class="text-sm font-medium">Profile</span>
                </div>
            </button>
            <button class="flex items-center justify-between px-4 py-3 bg-transparent border border-transparent rounded-lg text-gray-400 hover:text-white hover:bg-[#16161a] transition-all">
                <div class="flex items-center space-x-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <span class="text-sm font-medium">Security</span>
                </div>
            </button>
            <button class="flex items-center justify-between px-4 py-3 bg-transparent border border-transparent rounded-lg text-gray-400 hover:text-white hover:bg-[#16161a] transition-all">
                <div class="flex items-center space-x-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span class="text-sm font-medium">Preferences</span>
                </div>
            </button>
        </div>

        <!-- Main Settings Content -->
        <div class="lg:col-span-2 bg-[#121216] border border-[#25252c] rounded-xl p-6 shadow-xl">
            
            <h2 class="text-xl font-semibold text-white mb-6 border-b border-[#25252c] pb-3">Public Profile</h2>
            
            <div class="flex items-center space-x-6 mb-8">
                <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-cyan-600 to-purple-600 flex items-center justify-center shadow-lg border-2 border-[#25252c]">
                    <span class="text-2xl font-bold text-white">{{ session.get('user', 'guest')[0].upper() }}</span>
                </div>
                <div>
                    <button class="bg-[#1e1e24] border border-[#33333d] hover:bg-[#282830] transition-colors text-white text-sm font-medium px-4 py-2 rounded-md shadow-sm">
                        Change Avatar
                    </button>
                    <p class="text-xs text-gray-500 mt-2">JPG, GIF or PNG. 1MB max.</p>
                </div>
            </div>

            <form class="space-y-5" onsubmit="event.preventDefault(); alert('Profile updated (demo)!');">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" value="{{ session.get('user', 'guest') }}" class="w-full bg-[#0d0d10] border border-[#2a2a32] rounded-md px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" value="{{ session.get('user', 'guest') }}@cyberspace.local" class="w-full bg-[#0d0d10] border border-[#2a2a32] rounded-md px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Bio / Status</label>
                    <textarea rows="3" class="w-full bg-[#0d0d10] border border-[#2a2a32] rounded-md px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all" placeholder="I'm a security researcher..."></textarea>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-5 py-2.5 rounded-md shadow-lg shadow-cyan-900/20 transition-colors text-sm">
                        Save Changes
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
